[workspace]
members = ["crates/ii-shell"]
resolver = "2"

[workspace.package]
edition = "2024"
license = "GPL-3.0-only"
rust-version = "1.86"

[workspace.dependencies]
smithay-client-toolkit = { version = "=0.21.1", default-features = false }
tiny-skia = "=0.12.0"
cosmic-text = { version = "=0.19.0", default-features = false, features = ["std", "swash", "fontconfig"] }
zbus = { version = "=5.19.0", default-features = false, features = ["async-io"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"

[profile.dev]
debug = 0
